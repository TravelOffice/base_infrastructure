#  Refer to - Facebook Message API: https://developers.facebook.com/docs/messenger-platform/reference/webhook-events/messages
type Message @aws_api_key @aws_cognito_user_pools{
	#  A unique identifier for the Message.
	id: String!
	#  Created at as timestamp
	timestamp: AWSTimestamp
	#  Sender
	sender: String!
	#  Recipient
	recipient: String!
	# Customer id
	customerId: String!
	# Abtraction object which contains all the conversation data
	# Each third-party messaging provider has difference schema definition
	messageData: AWSJSON
	#  Chat plaform type
	chatPlatform: String!
}

type MessageMutationResponse implements ResolverResponse @aws_api_key @aws_cognito_user_pools{
	message: String
	data: Message
}

type MessagesQueryResponse implements ResolverResponse {
	message: String
	data: AWSJSON
}

type Mutation @aws_api_key @aws_cognito_user_pools {
	#  Send a message to customer. The message is send from Sales Web Application
	sendMessage(
		sender: String!,
		recipient: String!,
		customerId: String!,
		messageData: AWSJSON,
		chatPlatform: String!
	): MessageMutationResponse
	receivedMessage(
		sender: String!,
		recipient: String!,
		customerId: String!,
		messageData: AWSJSON,
		timestamp: AWSTimestamp,
		id: String!,
		chatPlatform: String!
	): MessageMutationResponse
}

type Query {
	#  Get all the related User. TODO: Fetch data by page.
	allUsers: [AWSJSON]
	#  Get user profile
	user(id: ID!): AWSJSON
	#  Get my user/page.
	me: AWSJSON
	# Get all Facebook messages for given conversation id of a page
	allFbMessages(pageId: String!, conversationId: String!, after: String, limit: Int): MessagesQueryResponse
	# Get Facebook conversations for given page
	allFbConversations(pageId: String!): MessagesQueryResponse
	# Get all Zalo messages for given conversation id of a page
	allZaloMessages(pageId: String!, userId: String!, offset: Int, count: Int): MessagesQueryResponse
	# Get Zalo conversations for given page
	allZaloConversations(pageId: String!, offset: Int, count: Int): MessagesQueryResponse
	# Get Telegram conversations for given bot id
	allTelegramConversations(pageId: String!): MessagesQueryResponse
	# Get Telegram messages for given conversation
	allTelegramMessages(pageId: String!, conversationId: String!): MessagesQueryResponse
	# Get user profile information
	userProfile(platform: String!, pageId: String!, pageUserId: String!): MessagesQueryResponse
}

interface ResolverResponse {
	message: String
}

type Subscription {
	#  Subscribes to message received event. Means user send message to page
	onNewMessageReceived: MessageMutationResponse
		@aws_subscribe(mutations: ["receivedMessage"])
}

schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}