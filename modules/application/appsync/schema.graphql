#  Refer to 
############  - Facebook Message API: https://developers.facebook.com/docs/messenger-platform/reference/webhook-events/messages
type Message {
	#  A unique identifier for the Message.
	id: ID!
	#  Created at as timestamp
	timestamp: Int
	#  Sender
	sender: String!
	#  Recipient
	recipient: String!
	# Customer id
	customerId: String!
	#  Abtraction object which contains all the conversation data
	############  Each third-party messaging provider has difference schema definition
	messageData: AWSJSON
}

type MessageMutationResponse implements ResolverResponse {
	message: String
	data: Message
}

type MessagesQueryResponse implements ResolverResponse {
	message: String
	data: AWSJSON
}

type Mutation {
	#  Send a message to customer. The message is send from Sales Web Application
	sendMessage(
		sender: String!,
		recipient: String!,
		customerId: String!,
		messageData: AWSJSON
	): MessageMutationResponse
	#  Receive a message from customer. The message is sent from third-party webhook
	receivedMessage(
		sender: String!,
		recipient: String!,
		customerId: String!,
		messageData: AWSJSON,
		timestamp: Int,
		id: ID!
	): MessageMutationResponse
}

type Query {
	#  Get all the related User. TODO: Fetch data by page.
	allUsers: [AWSJSON]
	#  Get user profile
	user(id: ID!): AWSJSON
	#  Get my user/page.
	me: AWSJSON
	# Get all messages for given conversation id of a page
	allMessages(pageId: String!, conversationId: String!, before: String): MessagesQueryResponse
	# Get conversations for given page
	allConversations(pageId: String!): MessagesQueryResponse
}

interface ResolverResponse {
	message: String
}

type Subscription {
	#  Subscribes to message received event. Means user send message to page
	onNewMessageReceived: MessageMutationResponse
		@aws_subscribe(mutations: ["receivedMessage"])
}

schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}